<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pumpfun Cockpit — Inicializando...</title>
<style>
  :root {
    --bg: #07090e;
    --card: #0c121d;
    --border: #1a2538;
    --fg: #e2e8f0;
    --dim: #7f8ea3;
    --neon-green: #00ffaa;
    --accent: #00e5ff;
    --bad: #ff3366;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Fira Code", monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    user-select: none;
    -webkit-app-region: drag;
  }
  .splash-box {
    width: 580px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.7), 0 0 20px rgba(0, 229, 255, 0.1);
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 16px;
    -webkit-app-region: no-drag;
  }
  .logo-title {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.08em;
  }
  .logo-glyph {
    color: var(--neon-green);
    font-size: 26px;
    filter: drop-shadow(0 0 10px rgba(0,255,170,0.4));
  }
  .subtitle {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .progress-wrap {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.06);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
    margin: 8px 0;
  }
  .progress-bar {
    height: 100%;
    width: 25%;
    background: linear-gradient(90deg, var(--neon-green), var(--accent));
    border-radius: 3px;
    transition: width 0.3s ease;
    box-shadow: 0 0 12px var(--accent);
  }
  .step-text {
    font-size: 11px;
    color: var(--accent);
    min-height: 18px;
  }
  .logs-box {
    width: 100%;
    height: 120px;
    background: #040609;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    font-size: 10px;
    font-family: "Fira Code", monospace;
    color: var(--dim);
    text-align: left;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .logs-box .python-err { color: var(--bad); }
  .logs-box .supervisor { color: var(--neon-green); }
  .error-banner {
    display: none;
    background: rgba(255, 51, 102, 0.15);
    border: 1px solid var(--bad);
    color: #ffb3c6;
    padding: 10px;
    border-radius: 6px;
    font-size: 11px;
    text-align: left;
  }
  .btn-retry {
    align-self: center;
    background: #142033;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 6px 16px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-retry:hover {
    background: var(--accent);
    color: #07090e;
    box-shadow: 0 0 10px var(--accent);
  }
</style>
</head>
<body>

<div class="splash-box">
  <div class="logo-title">
    <span class="logo-glyph">⚡</span>
    <span>PUMPFUN QUANT COCKPIT</span>
  </div>
  <div class="subtitle">Terminal Cuantitativa & Supervisión en Vivo — Desktop v2.0</div>
  
  <div class="progress-wrap">
    <div class="progress-bar" id="p-bar"></div>
  </div>
  
  <div class="step-text" id="step-lbl">Conectando con el motor cuantitativo local (127.0.0.1:8787)...</div>
  
  <div class="error-banner" id="err-banner"></div>
  
  <div class="logs-box" id="log-console">
    [SYSTEM] Inicializando entorno nativo Electron v44...
  </div>

  <button class="btn-retry" id="btn-retry" style="display:none;" onclick="location.reload()">Reintentar Conexión</button>
</div>

<script>
  const logConsole = document.getElementById('log-console');
  const pBar = document.getElementById('p-bar');
  const stepLbl = document.getElementById('step-lbl');
  const errBanner = document.getElementById('err-banner');
  const btnRetry = document.getElementById('btn-retry');

  function appendLog(line) {
    const div = document.createElement('div');
    if (line.includes('ERR')) div.className = 'python-err';
    else if (line.includes('SUPERVISOR')) div.className = 'supervisor';
    div.textContent = line;
    logConsole.appendChild(div);
    logConsole.scrollTop = logConsole.scrollHeight;
  }

  if (window.electronAPI) {
    window.electronAPI.onBackendLog((line) => {
      appendLog(line);
    });

    window.electronAPI.onInitProgress((info) => {
      if (info.percent) pBar.style.width = info.percent + '%';
      if (info.step) stepLbl.textContent = info.step;
    });

    window.electronAPI.onInitError((info) => {
      pBar.style.background = 'var(--bad)';
      stepLbl.textContent = 'Fallo de Inicialización';
      stepLbl.style.color = 'var(--bad)';
      errBanner.style.display = 'block';
      errBanner.textContent = info.message || 'Error desconocido';
      btnRetry.style.display = 'inline-block';
    });
  }
</script>
</body>
</html>
