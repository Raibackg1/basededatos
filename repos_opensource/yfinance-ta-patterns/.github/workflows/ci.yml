name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run linter (ruff)
        if: matrix.python-version == '3.12'
        run: ruff check .

      - name: Run type checker (mypy)
        if: matrix.python-version == '3.12'
        run: mypy yfinance_ta_patterns

      - name: Run tests (pytest)
        run: pytest -v

      - name: Run release verification script
        run: python scripts/verify_release.py


  verify-platforms:
    name: Verify on ${{ matrix.os }} (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Test current package from source
        shell: bash
        run: |
          uv init --no-workspace test_project --python ${{ matrix.python-version }}
          cd test_project
          uv add "$GITHUB_WORKSPACE"
          uv run python -c "import pandas, numpy, rich, yfinance_ta_patterns; print('=== INSTALLED CLEANLY ON ${{ matrix.os }} ==='); print('yftp:', yfinance_ta_patterns.__version__)"
          uv run yftp --version
          uv run python "$GITHUB_WORKSPACE/scripts/verify_release.py"
          uv add pytest
          uv run pytest "$GITHUB_WORKSPACE/tests" -q -W "ignore:.*urllib3 v2 only supports OpenSSL.*:Warning"


  verify-windows-experimental:
    name: Verify on windows-latest (py${{ matrix.python-version }}${{ matrix.gil-desc }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.13t"
            gil-desc: " No-GIL"
            wheel_glob: "*cp313t*"
            python_gil: "0"
            verify_script: "scripts/verify_free_threaded.py"
          - python-version: "3.14t"
            gil-desc: " No-GIL"
            wheel_glob: "*cp314t*"
            python_gil: "0"
            verify_script: "scripts/verify_free_threaded.py"
          - python-version: "3.15t"
            gil-desc: " No-GIL"
            wheel_glob: "*cp315t*"
            python_gil: "0"
            verify_script: "scripts/verify_free_threaded.py"
          - python-version: "3.15"
            gil-desc: " (standard GIL)"
            wheel_glob: "*cp315-cp315-*"
            python_gil: "1"
            verify_script: "scripts/verify_release.py"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Download matching wheelhouse
        run: |
          gh release download v0.3.26 -R eminsk/yfinance-ta-patterns -D wheelhouse -p "${{ matrix.wheel_glob }}" -p "yfinance-1.7.0-py2.py3-none-any.whl" || true
          gh release download v0.3.30 -R eminsk/yfinance-ta-patterns -D wheelhouse -p "${{ matrix.wheel_glob }}" -p "yfinance-1.7.0-py2.py3-none-any.whl" || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test current package
        env:
          PYTHON_GIL: ${{ matrix.python_gil }}
          GH_TOKEN: ${{ github.token }}
        run: |
          uv init --no-workspace test_experimental --python ${{ matrix.python-version }}
          Set-Location test_experimental
          if ("${{ matrix.python-version }}" -eq "3.15") {
            Remove-Item "$env:GITHUB_WORKSPACE\wheelhouse\*cp315t*" -ErrorAction SilentlyContinue
            uv add "${env:GITHUB_WORKSPACE}" --find-links "$env:GITHUB_WORKSPACE\wheelhouse" --no-build-package pandas
            try {
              Get-ChildItem -Path (uv cache dir) -Recurse -Filter "*cp315*.whl" -ErrorAction SilentlyContinue | ForEach-Object {
                gh release upload v0.3.30 $_.FullName --clobber -R eminsk/yfinance-ta-patterns
              }
            } catch {}
          } elseif ("${{ matrix.python-version }}" -eq "3.13t") {
            Remove-Item "$env:GITHUB_WORKSPACE\wheelhouse\yfinance-1.7.0*" -ErrorAction SilentlyContinue
            uv add "yfinance<=1.5.2" "numpy<=2.4.6" "pandas==3.0.5" --find-links "$env:GITHUB_WORKSPACE\wheelhouse" --no-build-package pandas --no-build-package curl-cffi --no-build-package numpy
            uv add "${env:GITHUB_WORKSPACE}" --find-links "$env:GITHUB_WORKSPACE\wheelhouse" --no-build-package pandas --no-build-package curl-cffi --no-build-package numpy
          } else {
            uv add "${env:GITHUB_WORKSPACE}" --find-links "$env:GITHUB_WORKSPACE\wheelhouse" --no-build-package pandas --no-build-package curl-cffi
          }
          uv run python -c "import pandas, numpy, rich, yfinance_ta_patterns; print('=== INSTALLED CLEANLY ON Windows ${{ matrix.python-version }} ==='); print('yftp:', yfinance_ta_patterns.__version__)"
          uv run python -m yfinance_ta_patterns.cli --version
          uv run python "$env:GITHUB_WORKSPACE\${{ matrix.verify_script }}"

  verify-windows-pypy:
    name: Verify on windows-latest (${{ matrix.pypy-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pypy-version: "pypy-3.11.15"
            abi: "pp311"
          - pypy-version: "pypy-3.10"
            abi: "pp310"
          - pypy-version: "pypy-3.9"
            abi: "pp39"
          - pypy-version: "pypy-3.8"
            abi: "pp38"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Download PyPy wheels from release
        run: |
          New-Item -ItemType Directory -Path release_wheels -Force | Out-Null
          for ($i = 1; $i -le 3; $i++) {
            gh release download v0.3.30 -R eminsk/yfinance-ta-patterns -D release_wheels --clobber -p "*${{ matrix.abi }}*win*" 2>$null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 3
          }
          $LASTEXITCODE = 0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build wheel for current workspace
        run: |
          uv build --wheel --out-dir "$env:GITHUB_WORKSPACE\dist"

      - name: Test uv add yfinance-ta-patterns with PyPy wheels
        run: |
          Copy-Item -Recurse -Force release_wheels C:\release_wheels
          $testDir = "C:\test_pypy"
          Remove-Item -Recurse -Force $testDir -ErrorAction SilentlyContinue
          uv python install ${{ matrix.pypy-version }}
          $pypyExe = uv python find ${{ matrix.pypy-version }}
          & $pypyExe -m venv "$testDir\.venv"
          uv init --no-workspace $testDir --python ${{ matrix.pypy-version }}
          Set-Location $testDir
          uv python pin ${{ matrix.pypy-version }}
          if ("${{ matrix.pypy-version }}" -eq "pypy-3.11.15") {
            uv add "pandas<=3.0.5" "yfinance<=1.2.0" --find-links C:\release_wheels
          } elseif ("${{ matrix.pypy-version }}" -eq "pypy-3.10") {
            uv add "pandas<=2.3.3" "numpy==2.2.6" "yfinance<=1.2.0" --find-links C:\release_wheels
          } elseif ("${{ matrix.pypy-version }}" -eq "pypy-3.9") {
            uv add "pandas<=2.3.3" "numpy<2" "yfinance<=1.2.0" --find-links C:\release_wheels
          } elseif ("${{ matrix.pypy-version }}" -eq "pypy-3.8") {
            uv add "pandas<=2.0.3" "numpy<2" "yfinance<=1.2.0" --find-links C:\release_wheels
          }
          $currentWheel = (Get-Item "$env:GITHUB_WORKSPACE\dist\yfinance_ta_patterns-*.whl").FullName
          uv add "${currentWheel}" --find-links C:\release_wheels
          try { uv run python -c "import dateutil.tz.win as w; p = w.__file__; open(p, 'w').write(open(p).read().replace('self._tzres._handle', 'int(self._tzres._handle)'))" } catch {}
          try { uv run python -c "import talib; print('TA-Lib:', talib.__version__)" } catch {}
          uv run python -c "import pandas, numpy, rich, yfinance_ta_patterns; print('=== INSTALLED CLEANLY ON Windows ${{ matrix.pypy-version }} ==='); print('yftp:', yfinance_ta_patterns.__version__)"
          uv run python -m yfinance_ta_patterns.cli --version
          uv run python "$env:GITHUB_WORKSPACE\scripts\verify_release.py"
          if ("${{ matrix.pypy-version }}" -eq "pypy-3.10") {
            uv add pytest
            uv run pytest "$env:GITHUB_WORKSPACE\tests" -q -W "ignore:.*urllib3 v2 only supports OpenSSL.*:Warning"
          }


  verify-linux-pypy:
    name: Verify on ubuntu-latest (${{ matrix.pypy-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pypy-version: "pypy-3.11.15"
            abi: "pp311"
          - pypy-version: "pypy-3.10"
            abi: "pp310"
          - pypy-version: "pypy-3.9"
            abi: "pp39"
          - pypy-version: "pypy-3.8"
            abi: "pp38"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Download PyPy wheels from release
        shell: bash
        run: |
          mkdir -p release_wheels
          for i in 1 2 3; do
            gh release download v0.3.30 -R eminsk/yfinance-ta-patterns -D release_wheels --clobber -p "*${{ matrix.abi }}*linux*" -p "*yfinance*" 2>/dev/null && break || sleep 3
          done || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build wheel for current workspace
        shell: bash
        run: uv build --wheel --out-dir "$GITHUB_WORKSPACE/dist"

      - name: Test uv add yfinance-ta-patterns with PyPy wheels
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          uv init --no-workspace test_pypy --python ${{ matrix.pypy-version }}
          cd test_pypy
          uv python pin ${{ matrix.pypy-version }}
          if [ "${{ matrix.pypy-version }}" = "pypy-3.11.15" ]; then
            uv add "pandas<=3.0.5" --find-links ../release_wheels
          elif [ "${{ matrix.pypy-version }}" = "pypy-3.10" ]; then
            uv add "pandas<=2.2.3" "numpy==2.2.6" "yfinance<=1.2.0" --find-links ../release_wheels
          elif [ "${{ matrix.pypy-version }}" = "pypy-3.9" ]; then
            uv add "pandas<=2.2.3" "numpy<2" --find-links ../release_wheels
          elif [ "${{ matrix.pypy-version }}" = "pypy-3.8" ]; then
            uv add "pandas<=2.0.3" "numpy<2" --find-links ../release_wheels
          fi
          current_wheel=$(ls "$GITHUB_WORKSPACE/dist"/yfinance_ta_patterns-*.whl)
          uv add "${current_wheel}" --find-links ../release_wheels
          uv run python -c "import talib; print('TA-Lib:', talib.__version__)" 2>/dev/null || true
          uv run python -c "import pandas, numpy, rich, yfinance_ta_patterns; print('=== INSTALLED CLEANLY ON Linux ${{ matrix.pypy-version }} ==='); print('yftp:', yfinance_ta_patterns.__version__)"
          uv run python -m yfinance_ta_patterns.cli --version
          uv run python "$GITHUB_WORKSPACE/scripts/verify_release.py"
          if [ "${{ matrix.pypy-version }}" = "pypy-3.10" ]; then
            uv add pytest
            uv run pytest "$GITHUB_WORKSPACE/tests" -q -W "ignore:.*urllib3 v2 only supports OpenSSL.*:Warning"
          fi

  verify-macos-pypy:
    name: Verify on macos-latest (${{ matrix.pypy-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pypy-version: "pypy-3.11.15"
            abi: "pp311"
          - pypy-version: "pypy-3.10"
            abi: "pp310"
          - pypy-version: "pypy-3.9"
            abi: "pp39"
          - pypy-version: "pypy-3.8"
            abi: "pp38"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Download PyPy wheels from release
        shell: bash
        run: |
          mkdir -p release_wheels
          for i in 1 2 3; do
            gh release download v0.3.30 -R eminsk/yfinance-ta-patterns -D release_wheels --clobber -p "*${{ matrix.abi }}*macosx*" -p "*yfinance*" 2>/dev/null && break || sleep 3
          done || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build wheel for current workspace
        shell: bash
        run: uv build --wheel --out-dir "$GITHUB_WORKSPACE/dist"

      - name: Test uv add yfinance-ta-patterns with PyPy wheels
        shell: bash
        env:
          CC: clang
          CXX: clang++
          LDSHARED: "clang -bundle -undefined dynamic_lookup"
          LDCXXSHARED: "clang++ -bundle -undefined dynamic_lookup"
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
          NPY_NUM_BUILD_JOBS: "4"
          GH_TOKEN: ${{ github.token }}
        run: |
          uv init --no-workspace test_pypy --python ${{ matrix.pypy-version }}
          cd test_pypy
          uv python pin ${{ matrix.pypy-version }}
          if [ "${{ matrix.pypy-version }}" = "pypy-3.11.15" ]; then
            uv add "pandas<=3.0.5" --find-links ../release_wheels
          elif [ "${{ matrix.pypy-version }}" = "pypy-3.10" ]; then
            uv add "pandas<=2.2.3" "numpy==2.2.6" "yfinance<=1.2.0" --find-links ../release_wheels
          elif [ "${{ matrix.pypy-version }}" = "pypy-3.9" ]; then
            uv add "pandas<=2.2.3" "numpy<2" --find-links ../release_wheels
          elif [ "${{ matrix.pypy-version }}" = "pypy-3.8" ]; then
            uv add "pandas<=2.0.3" "numpy<2" --find-links ../release_wheels
            find "$(uv cache dir)" -name "pandas*pp38*.whl" -exec gh release upload v0.3.30 {} --clobber -R eminsk/yfinance-ta-patterns \; 2>/dev/null || true
          fi
          current_wheel=$(ls "$GITHUB_WORKSPACE/dist"/yfinance_ta_patterns-*.whl)
          uv add "${current_wheel}" --find-links ../release_wheels
          find "$(uv cache dir)" -name "lxml*.whl" -exec gh release upload v0.3.30 {} --clobber -R eminsk/yfinance-ta-patterns \; 2>/dev/null || true
          uv run python -c "import talib; print('TA-Lib:', talib.__version__)" 2>/dev/null || true
          uv run python -c "import pandas, numpy, rich, yfinance_ta_patterns; print('=== INSTALLED CLEANLY ON macOS ${{ matrix.pypy-version }} ==='); print('yftp:', yfinance_ta_patterns.__version__)"
          uv run python -m yfinance_ta_patterns.cli --version
          uv run python "$GITHUB_WORKSPACE/scripts/verify_release.py"
          if [ "${{ matrix.pypy-version }}" = "pypy-3.10" ]; then
            uv add pytest
            uv run pytest "$GITHUB_WORKSPACE/tests" -q -W "ignore:.*urllib3 v2 only supports OpenSSL.*:Warning"
          fi


  verify-38-all:
    name: Verify on ${{ matrix.os }} (py3.8)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Download 3.8 wheels from release
        run: |
          gh release download v0.3.30 -R eminsk/yfinance-ta-patterns -D release_wheels -p "*ta_lib*cp38*" -p "*yfinance_ta_patterns*" || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test uv add yfinance-ta-patterns
        shell: bash
        run: |
          uv init --no-workspace test_py38 --python 3.8
          cd test_py38
          uv add "$GITHUB_WORKSPACE" --find-links ../release_wheels
          uv run python -c "import pandas, numpy, rich, yfinance_ta_patterns; print('=== INSTALLED CLEANLY ON ${{ matrix.os }} (py3.8) ==='); print('yftp:', yfinance_ta_patterns.__version__)"
          uv run yftp --version
          uv run python "$GITHUB_WORKSPACE/scripts/verify_release.py"
          uv add pytest
          uv run pytest "$GITHUB_WORKSPACE/tests" -q -W "ignore:.*urllib3 v2 only supports OpenSSL.*:Warning"


  verify-pypy-312:
    name: Verify pure-Python on ${{ matrix.os }} (pypy-3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Test yfinance-ta-patterns pure-Python fallback on PyPy 3.12
        shell: bash
        run: |
          uv init --no-workspace test_pypy12 --python pypy-3.12
          cd test_pypy12
          uv python pin pypy-3.12
          uv add "$GITHUB_WORKSPACE"
          uv run python "$GITHUB_WORKSPACE/scripts/verify_pypy_312.py"
          uv add pytest
          uv run pytest "$GITHUB_WORKSPACE/tests" -q


  verify-source-freethreaded:
    name: Verify from git source on ${{ matrix.os }} (py${{ matrix.python-version }} No-GIL)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13t"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Free-Threaded Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install yfinance-ta-patterns directly from git source
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps .
          python -m pip install pytest rich pytz

      - name: Run test suite from git source (No-GIL)
        env:
          PYTHON_GIL: "0"
        run: |
          pytest -v


  verify-source-pure-python:
    name: Verify pure-Python from git source on ${{ matrix.os }} (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.14", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install yfinance-ta-patterns directly from git source
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest rich pytz

      - name: Run test suite from git source
        run: |
          pytest -v


  test-cpython-316:
    name: CPython 3.16 (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: "standard"
            configure-args: ""
            gil-flag: ""
            bin-name: "python3.16"
          - mode: "free-threaded-nogil"
            configure-args: "--disable-gil"
            gil-flag: "-X gil=0"
            bin-name: "python3.16t"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache CPython 3.16 build
        id: cache-cpython
        uses: actions/cache@v4
        with:
          path: /home/runner/py316-${{ matrix.mode }}
          key: cpython-316-${{ matrix.mode }}-v1
          restore-keys: |
            cpython-316-${{ matrix.mode }}-

      - name: Build CPython 3.16 from source (if not cached)
        if: steps.cache-cpython.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential libssl-dev zlib1g-dev libffi-dev libsqlite3-dev
          git clone --depth 1 https://github.com/python/cpython.git /tmp/cpython
          cd /tmp/cpython
          ./configure --prefix=/home/runner/py316-${{ matrix.mode }} ${{ matrix.configure-args }}
          make -j$(nproc)
          make install

      - name: Verify CPython 3.16 & GIL state
        run: |
          if [ -x "/home/runner/py316-${{ matrix.mode }}/bin/${{ matrix.bin-name }}" ]; then
            PYTHON_BIN="/home/runner/py316-${{ matrix.mode }}/bin/${{ matrix.bin-name }}"
          else
            PYTHON_BIN="/home/runner/py316-${{ matrix.mode }}/bin/python3"
          fi
          $PYTHON_BIN -VV
          $PYTHON_BIN ${{ matrix.gil-flag }} -c "import sys; print('CPython 3.16 Version:', sys.version); print('Free-Threading GIL active:', getattr(sys, '_is_gil_enabled', lambda: 'N/A')())"

      - name: Install dependencies & yfinance-ta-patterns from git source
        run: |
          if [ -x "/home/runner/py316-${{ matrix.mode }}/bin/${{ matrix.bin-name }}" ]; then
            PYTHON_BIN="/home/runner/py316-${{ matrix.mode }}/bin/${{ matrix.bin-name }}"
          else
            PYTHON_BIN="/home/runner/py316-${{ matrix.mode }}/bin/python3"
          fi
          $PYTHON_BIN -m ensurepip --default-pip || true
          $PYTHON_BIN -m pip install --upgrade pip setuptools wheel pytest rich pytz || true
          $PYTHON_BIN -m pip install --no-deps .

      - name: Run test suite & verify Python 3.16 / 3.16t compatibility
        env:
          PYTHONPATH: .
        run: |
          if [ -x "/home/runner/py316-${{ matrix.mode }}/bin/${{ matrix.bin-name }}" ]; then
            PYTHON_BIN="/home/runner/py316-${{ matrix.mode }}/bin/${{ matrix.bin-name }}"
          else
            PYTHON_BIN="/home/runner/py316-${{ matrix.mode }}/bin/python3"
          fi
          $PYTHON_BIN ${{ matrix.gil-flag }} -m pytest -v tests/test_python316_compat.py tests/test_pypy_compat_v55.py
          $PYTHON_BIN ${{ matrix.gil-flag }} -m pytest -v tests/
          $PYTHON_BIN ${{ matrix.gil-flag }} -c "import yfinance_ta_patterns as ytp; print('=== INSTALLED CLEANLY ON Python 3.16 (${{ matrix.mode }}) ==='); print('yftp:', ytp.__version__)"
          $PYTHON_BIN ${{ matrix.gil-flag }} -m yfinance_ta_patterns.cli --version
          if [ "${{ matrix.mode }}" = "free-threaded-nogil" ]; then
            $PYTHON_BIN ${{ matrix.gil-flag }} scripts/verify_free_threaded.py
          fi


