name: Build PyPy Wheels

on:
  workflow_dispatch:
  push:
    branches:
      - 'build-wheels-*'

permissions:
  contents: write

jobs:
  build-linux-pypy:
    name: Linux PyPy (${{ matrix.pypy-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pypy-version: "pypy3.11"
            pandas-version: "3.0.5"
            talib-version: "0.7.1"
            curlcffi-version: "0.16.3"
          - pypy-version: "pypy3.10"
            pandas-version: "2.2.3"
            talib-version: "0.7.1"
            curlcffi-version: "0.16.3"
          - pypy-version: "pypy3.9"
            pandas-version: "2.2.3"
            talib-version: "0.7.1"
            curlcffi-version: "0.13.0"
          - pypy-version: "pypy3.8"
            pandas-version: "2.0.3"
            talib-version: "0.6.4"
            curlcffi-version: "0.9.0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up PyPy ${{ matrix.pypy-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.pypy-version }}

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential patchelf libcurl4-openssl-dev python3-pip python3-venv pipx

      - name: Install TA-Lib C library (v0.7.1)
        run: |
          curl -fsSL -o ta-lib.deb https://github.com/TA-Lib/ta-lib/releases/download/v0.7.1/ta-lib_0.7.1_amd64.deb
          sudo dpkg -i ta-lib.deb
          sudo cp -r /usr/include/ta-lib/* /usr/include/ || true
          sudo ldconfig

      - name: Install Python build tools
        run: |
          if [ "${{ matrix.pypy-version }}" = "pypy3.8" ]; then
            python -m pip install "pip<24.1" setuptools wheel
            python -m pip install "cython<3.0.0"
          else
            python -m pip install --upgrade pip setuptools wheel
            python -m pip install cython
          fi
          python -m pip install numpy build wheel meson-python ninja versioneer
          /usr/bin/python3 -m pip install --break-system-packages auditwheel || pipx install auditwheel || true

      - name: Build ta-lib wheel
        env:
          TA_LIBRARY_PATH: /usr/lib:/usr/local/lib
          TA_INCLUDE_PATH: /usr/include:/usr/local/include:/usr/include/ta-lib
        run: |
          mkdir -p raw_wheels dist
          python -m pip wheel "ta-lib==${{ matrix.talib-version }}" --no-deps --no-build-isolation -w raw_wheels/
          for w in raw_wheels/TA_Lib*.whl; do
            [ -f "$w" ] && mv "$w" "$(echo "$w" | sed 's/TA_Lib/ta_lib/')"
          done
          /usr/bin/python3 -m auditwheel repair raw_wheels/ta_lib*.whl -w dist/ || pipx run auditwheel repair raw_wheels/ta_lib*.whl -w dist/ || cp raw_wheels/ta_lib*.whl dist/

      - name: Build pandas wheel
        env:
          CC: gcc
          CXX: g++
          LDSHARED: "gcc -shared"
          LDCXXSHARED: "g++ -shared"
        run: |
          echo "Building pandas ${{ matrix.pandas-version }} for ${{ matrix.pypy-version }}"
          python -m pip wheel "pandas==${{ matrix.pandas-version }}" --no-deps --no-build-isolation -w raw_wheels/ || true
          /usr/bin/python3 -m auditwheel repair raw_wheels/pandas*.whl -w dist/ || pipx run auditwheel repair raw_wheels/pandas*.whl -w dist/ || cp raw_wheels/pandas*.whl dist/ || true

      - name: Build curl_cffi wheel
        run: |
          python -m pip wheel "curl-cffi==${{ matrix.curlcffi-version }}" --no-deps -w raw_wheels/ || true
          /usr/bin/python3 -m auditwheel repair raw_wheels/curl_cffi*.whl -w dist/ || pipx run auditwheel repair raw_wheels/curl_cffi*.whl -w dist/ || cp raw_wheels/curl_cffi*.whl dist/ || true

      - name: List built wheels
        run: |
          ls -la dist/

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.pypy-version }}
          path: dist/*.whl

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.3.30 dist/*.whl --clobber -R eminsk/yfinance-ta-patterns || true

  build-macos-pypy:
    name: macOS ARM64 PyPy (${{ matrix.pypy-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pypy-version: "pypy3.11"
            pandas-version: "3.0.5"
            talib-version: "0.7.1"
            curlcffi-version: "0.16.3"
          - pypy-version: "pypy3.10"
            pandas-version: "2.2.3"
            talib-version: "0.7.1"
            curlcffi-version: "0.16.3"
          - pypy-version: "pypy3.9"
            pandas-version: "2.2.3"
            talib-version: "0.7.1"
            curlcffi-version: "0.13.0"
          - pypy-version: "pypy3.8"
            pandas-version: "2.0.3"
            talib-version: "0.6.4"
            curlcffi-version: "0.7.4"

    steps:
      - uses: actions/checkout@v4

      - name: Install TA-Lib via Homebrew
        run: |
          brew install ta-lib

      - name: Set up PyPy ${{ matrix.pypy-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.pypy-version }}

      - name: Install Python build tools
        run: |
          if [ "${{ matrix.pypy-version }}" = "pypy3.8" ]; then
            python -m pip install --upgrade "pip>=23.3,<24.1" setuptools wheel
            python -m pip install "cython<3.0.0" "numpy<2"
          elif [ "${{ matrix.pypy-version }}" = "pypy3.9" ]; then
            python -m pip install --upgrade pip setuptools wheel
            python -m pip install cython "numpy<2"
          else
            python -m pip install --upgrade pip setuptools wheel
            python -m pip install cython numpy
          fi
          python -m pip install build delocate meson-python ninja versioneer

      - name: Build ta-lib wheel
        env:
          CFLAGS: "-Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-error=int-conversion -I/opt/homebrew/include"
          LDFLAGS: "-L/opt/homebrew/lib"
          TA_INCLUDE_PATH: "/opt/homebrew/include"
          TA_LIBRARY_PATH: "/opt/homebrew/lib"
          DYLD_FALLBACK_LIBRARY_PATH: "/opt/homebrew/lib"
        run: |
          mkdir -p raw_wheels dist
          python -m pip wheel "ta-lib==${{ matrix.talib-version }}" --no-deps --no-build-isolation -w raw_wheels/
          delocate-wheel --require-archs arm64 -w dist/ -v raw_wheels/*.whl || cp raw_wheels/*.whl dist/

      - name: Build pandas wheel
        env:
          CC: clang
          CXX: clang++
          LDSHARED: "clang -bundle -undefined dynamic_lookup"
          LDCXXSHARED: "clang++ -bundle -undefined dynamic_lookup"
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          echo "Building pandas ${{ matrix.pandas-version }} for ${{ matrix.pypy-version }}"
          mkdir -p /tmp/pandas_src
          python -m pip download --no-deps "pandas==${{ matrix.pandas-version }}" -d /tmp/pandas_src
          tar -xzf /tmp/pandas_src/pandas-*.tar.gz -C /tmp/pandas_src/
          cd /tmp/pandas_src/pandas-*
          python -m build --wheel --no-isolation -o "$GITHUB_WORKSPACE/raw_wheels/" || python -m pip wheel . --no-deps --no-build-isolation -w "$GITHUB_WORKSPACE/raw_wheels/" || true
          cd "$GITHUB_WORKSPACE"
          delocate-wheel --require-archs arm64 -w dist/ -v raw_wheels/pandas*.whl || cp raw_wheels/pandas*.whl dist/ || true

      - name: Build curl_cffi wheel
        run: |
          export MACOSX_DEPLOYMENT_TARGET=11.0
          python -m pip wheel "curl-cffi==${{ matrix.curlcffi-version }}" --no-deps -w raw_wheels/ || true
          delocate-wheel --require-archs arm64 -w dist/ -v raw_wheels/curl_cffi*.whl || cp raw_wheels/curl_cffi*.whl dist/ || true

      - name: Build cffi wheel
        run: |
          export MACOSX_DEPLOYMENT_TARGET=11.0
          python -m pip wheel cffi --no-deps -w raw_wheels/ || true
          delocate-wheel --require-archs arm64 -w dist/ -v raw_wheels/cffi*.whl || cp raw_wheels/cffi*.whl dist/ || true

      - name: Build numpy wheel
        run: |
          if [ "${{ matrix.pypy-version }}" != "pypy3.11" ]; then
            python -m pip wheel "numpy<2" --no-deps -w raw_wheels/ || true
            delocate-wheel --require-archs arm64 -w dist/ -v raw_wheels/numpy*.whl || cp raw_wheels/numpy*.whl dist/ || true
          fi

      - name: List built wheels
        run: |
          find ~/Library/Caches/pip/wheels -name "numpy*.whl" -exec cp {} dist/ \; || true
          find ~/Library/Caches/pip/wheels -name "pandas*.whl" -exec cp {} dist/ \; || true
          for f in dist/TA_Lib*.whl; do
            [ -f "$f" ] && mv "$f" "$(echo "$f" | sed 's/TA_Lib/ta_lib/')"
          done
          for f in dist/*universal2*.whl; do
            [ -f "$f" ] && mv "$f" "$(echo "$f" | sed 's/macosx_[0-9_]*_universal2/macosx_26_0_arm64/')"
          done
          ls -la dist/

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.pypy-version }}
          path: dist/*.whl

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.3.30 dist/*.whl --clobber -R eminsk/yfinance-ta-patterns || true

  build-cpython38:
    name: CPython 3.8 TA-Lib (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential patchelf python3-pip python3-venv pipx
          curl -fsSL -o ta-lib.deb https://github.com/TA-Lib/ta-lib/releases/download/v0.7.1/ta-lib_0.7.1_amd64.deb
          sudo dpkg -i ta-lib.deb
          sudo cp -r /usr/include/ta-lib/* /usr/include/ || true
          sudo ldconfig

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ta-lib

      - name: Build ta-lib wheel
        env:
          CFLAGS: "-Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-error=int-conversion -I/opt/homebrew/include"
          LDFLAGS: "-L/opt/homebrew/lib"
          TA_INCLUDE_PATH: "/opt/homebrew/include"
          TA_LIBRARY_PATH: "/opt/homebrew/lib"
          DYLD_FALLBACK_LIBRARY_PATH: "/opt/homebrew/lib"
          ARCHFLAGS: "-arch arm64"
          MACOSX_DEPLOYMENT_TARGET: "26.0"
        run: |
          python -m pip install --upgrade pip setuptools wheel "cython<3.0.0" numpy
          mkdir -p raw_wheels dist
          python -m pip wheel "ta-lib==0.6.4" --no-deps --no-build-isolation -w raw_wheels/
          if [ "${{ runner.os }}" = "Linux" ]; then
            /usr/bin/python3 -m pip install --break-system-packages auditwheel || pipx install auditwheel || true
            /usr/bin/python3 -m auditwheel repair raw_wheels/ta_lib*.whl -w dist/ || cp raw_wheels/ta_lib*.whl dist/
          else
            python -m pip install delocate
            for w in raw_wheels/*universal2*.whl; do
              [ -f "$w" ] && mv "$w" "$(echo "$w" | sed 's/macosx_[0-9_]*_universal2/macosx_26_0_arm64/')"
            done
            delocate-wheel --require-archs arm64 -w dist/ -v raw_wheels/*.whl || cp raw_wheels/*.whl dist/
          fi

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.3.30 dist/*.whl --clobber -R eminsk/yfinance-ta-patterns || true

  build-windows-pypy:
    name: Windows PyPy (${{ matrix.pypy-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pypy-version: "pypy3.11"
            pandas-version: "3.0.5"
            talib-version: "0.7.1"
            curlcffi-version: "0.16.3"
          - pypy-version: "pypy3.10"
            pandas-version: "2.2.3"
            talib-version: "0.7.1"
            curlcffi-version: "0.16.3"
          - pypy-version: "pypy3.9"
            pandas-version: "2.2.3"
            talib-version: "0.7.1"
            curlcffi-version: "0.13.0"
          - pypy-version: "pypy3.8"
            pandas-version: "2.0.3"
            talib-version: "0.6.4"
            curlcffi-version: "0.9.0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up PyPy ${{ matrix.pypy-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.pypy-version }}

      - name: Download and extract TA-Lib C Library (MSVC)
        run: |
          curl -fsSL -o ta-lib-msvc.zip https://github.com/eminsk/yfinance-ta-patterns/releases/download/v0.3.30/ta-lib-0.4.0-msvc.zip
          Expand-Archive ta-lib-msvc.zip -DestinationPath C:\ -Force
          if (Test-Path "C:\ta-lib\c\lib") {
            Write-Host "TA-Lib C library ready at C:\ta-lib"
          }

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install cython numpy build

      - name: Build ta-lib wheel
        env:
          TA_LIBRARY_PATH: C:\ta-lib\c\lib
          TA_INCLUDE_PATH: C:\ta-lib\c\include
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          python -m pip wheel "ta-lib==${{ matrix.talib-version }}" --no-deps --no-build-isolation -w dist/

      - name: Build curl_cffi wheel
        run: |
          python -m pip wheel "curl-cffi==${{ matrix.curlcffi-version }}" --no-deps -w dist/ || true

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.pypy-version }}
          path: dist/*.whl

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.3.30 dist/*.whl --clobber -R eminsk/yfinance-ta-patterns || true

