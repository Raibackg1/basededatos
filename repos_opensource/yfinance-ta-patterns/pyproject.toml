[project]
name = "yfinance-ta-patterns"
version = "0.3.60"
description = "Institutional-grade market candlestick pattern scanner with multi-asset backtesting, AI confluence scoring, and LLM market intelligence."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = [
    "yfinance",
    "technical-analysis",
    "candlestick-patterns",
    "ai",
    "trading",

    "forex",
    "stocks",
    "crypto",
    "algorithmic-trading",
    "free-threaded",
    "no-gil",
    "pep-703",
    "windows-7",
    "pypy",
    "pypy3",
    "rich",
]
authors = [
    { name = "eminsk", email = "M_N_Nik@yahoo.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3.16",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Operating System :: OS Independent",
]
dependencies = [
    "yfinance>=0.2.54; implementation_name != 'pypy' and python_version < '3.16'",
    "pandas>=1.3.0; implementation_name != 'pypy' and python_version < '3.16'",
    "pytz>=2022.5",
    "numpy>=1.20; implementation_name != 'pypy' and python_version < '3.16'",
    "rich>=10.0.0",
    "typing-extensions>=4.0; python_version < '3.11'",
    "multitasking<0.0.12; python_version < '3.9'",
]

[project.optional-dependencies]
yfinance = [
    "yfinance>=0.2.54",
]
pandas = [
    "pandas>=1.3.0, <=3.0.5; implementation_name == 'pypy' and python_version >= '3.11' and python_version < '3.12'",
    "pandas>=1.3.0; implementation_name != 'pypy'",
]
numpy = [
    "numpy>=1.20; implementation_name == 'pypy' and python_version >= '3.12'",
]
dev = [
    "pytest>=8.0; python_version >= '3.9'",
    "pytest>=7.4.0, <8.1; python_version < '3.9'",
    "pytest-cov>=4.0",
    "ruff>=0.8.0; python_version >= '3.9'",
    "mypy>=1.11.0; python_version >= '3.9'",
    "pandas-stubs>=2.0.0; python_version >= '3.9'",
    "types-pytz>=2022.5",
]

[project.scripts]
yfinance-ta-patterns = "yfinance_ta_patterns.cli:main"
yftp = "yfinance_ta_patterns.cli:main"
yfinance-ta-mcp = "yfinance_ta_patterns.mcp_server:main_mcp"

[project.urls]
Homepage = "https://github.com/eminsk/yfinance-ta-patterns"
Repository = "https://github.com/eminsk/yfinance-ta-patterns"
Documentation = "https://github.com/eminsk/yfinance-ta-patterns#readme"
"Issue Tracker" = "https://github.com/eminsk/yfinance-ta-patterns/issues"
Changelog = "https://github.com/eminsk/yfinance-ta-patterns/releases"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["yfinance_ta_patterns*"]

[tool.setuptools.package-data]
yfinance_ta_patterns = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::ImportWarning",
    "ignore:Data repair was requested.*:UserWarning",
    "ignore:Static default FX rate used.*:UserWarning",
    "ignore:Quote currency for .* using exchange suffix heuristic.*:UserWarning",
    "ignore:validate_ohlc dropped.*:UserWarning",
    "ignore:Corrupted OHLC data anomaly detected.*:UserWarning",
    "ignore:cython\\.collection_type only works on PyPy.*:RuntimeWarning",
    "ignore:.*urllib3 v2 only supports OpenSSL.*:Warning",
    "ignore:Numpy built with MINGW-W64.*:UserWarning",
    "ignore:Numpy built with MINGW-W64.*:Warning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py38"
extend-exclude = [
    "release-assets",
    "release-upload",
    "tmp_download",
    "winlogs",
    "dist",
    "build",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]


[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

